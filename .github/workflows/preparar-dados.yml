# Prepara os dados de populacao por setor (IBGE, Censo 2022) e de escolas (INEP via geobr)
# e grava o resultado compacto em dados_prontos/. Rodar a mao (Actions > Run workflow) quando
# houver ano novo de Censo Escolar; os dados mudam pouco. O build da Vercel so copia a pasta.
name: Preparar populacao e escolas

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --quiet pyshp
      - name: Gerar dados_prontos/
        run: python scripts/preparar_pessoas_escolas.py dados_prontos
      - name: Tamanho
        run: du -sh dados_prontos/* && ls -la dados_prontos/pessoas | head -40
      - name: Gravar no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados_prontos
          if git diff --cached --quiet; then echo "Sem mudanca."; exit 0; fi
          git commit -m "Dados prontos: populacao por setor (Censo 2022) e escolas (INEP 2023)"
          git push
