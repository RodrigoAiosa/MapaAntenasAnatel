# TEMPORARIO
name: Sondar fontes
on: workflow_dispatch
permissions: {}
jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: setores
        run: |
          M=https://ftp.ibge.gov.br/Censos/Censo_Demografico_2022/Agregados_por_Setores_Censitarios/malha_com_atributos/setores/
          echo "== gpkg/UF"; curl -s -m 60 $M/gpkg/UF/ | grep -E 'href="[A-Z]{2}_' | sed 's/<[^>]*>/ /g' | head -5
          F=$(curl -s -m 60 $M/gpkg/UF/ | grep -o 'href="AP[^"]*"' | head -1 | sed 's/href="//;s/"//'); echo "arquivo: $F"
          curl -sL -m 120 -o /tmp/ap.zip $M/gpkg/UF/$F; ls -la /tmp/ap.zip; cd /tmp && (unzip -o -q ap.zip || true); ls -la /tmp | head -20
          python3 - <<'PY'
          import sqlite3,glob
          for f in glob.glob('/tmp/**/*.gpkg',recursive=True):
              c=sqlite3.connect(f); print(f)
              for (n,) in c.execute("select table_name from gpkg_contents"):
                  print("tabela",n,c.execute("select count(*) from \"%s\""%n).fetchone())
                  print([r[1] for r in c.execute("pragma table_info(\"%s\")"%n)])
                  for r in c.execute("select * from \"%s\" limit 2"%n): print([(x if not isinstance(x,bytes) else x[:12].hex()) for x in r])
              print(c.execute("select column_name,geometry_type_name,srs_id from gpkg_geometry_columns").fetchall())
          PY
      - name: basico
        run: |
          A=https://ftp.ibge.gov.br/Censos/Censo_Demografico_2022/Agregados_por_Setores_Censitarios/Agregados_por_Setor_csv/
          curl -sL -m 120 -o /tmp/b.zip ${A}Agregados_por_setores_basico_BR_20260520.zip; cd /tmp && unzip -o -q b.zip; ls -la /tmp/*.csv; head -c 700 /tmp/Agregados_por_setores_basico_BR*.csv | cat -v | head -5
