# TEMPORARIO: descobre onde estao os arquivos de setores censitarios e de escolas.
name: Sondar fontes
on: workflow_dispatch
permissions: {}
jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: IBGE listas
        run: |
          A=https://ftp.ibge.gov.br/Censos/Censo_Demografico_2022/Agregados_por_Setores_Censitarios/
          for d in Agregados_por_Setor_csv malha_com_atributos; do echo "=== $d"; curl -s -m 60 $A$d/ | grep -E 'href="[^?/h][^"]*"' | sed 's/<[^>]*>/ /g' | head -40; done
          B=https://geoftp.ibge.gov.br/organizacao_do_territorio/malhas_territoriais/malhas_de_setores_censitarios__divisoes_intramunicipais/censo_2022/setores/
          for d in gpkg shp; do echo "=== $d"; curl -s -m 60 $B$d/ | grep -E 'href="[^?/h][^"]*"' | sed 's/<[^>]*>/ /g' | head -40; curl -s -m 60 $B$d/UF/ | grep -E 'href="[^?/h][^"]*"' | sed 's/<[^>]*>/ /g' | head -40; done
      - name: geobr escolas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in $(gh api repos/ipeaGIT/geobr/releases --jq '.[].tag_name'); do
            gh api "repos/ipeaGIT/geobr/releases/tags/$t" --jq '.assets[] | select(.name|test("school")) | [.name,.size,.browser_download_url] | @tsv' 2>/dev/null
          done | head -20
