# TEMPORARIO: descobre colunas dos arquivos de setores e de escolas.
name: Sondar fontes
on: workflow_dispatch
permissions: {}
jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: IBGE nomes
        run: |
          A=https://ftp.ibge.gov.br/Censos/Censo_Demografico_2022/Agregados_por_Setores_Censitarios/
          echo "== csv"; curl -s -m 60 ${A}Agregados_por_Setor_csv/ | grep -o 'href="[^"?/][^"]*"' | grep -v http
          M=${A}malha_com_atributos/setores/
          echo "== malha_com_atributos/setores"; curl -s -m 60 $M | grep -o 'href="[^"?/][^"]*"' | grep -v http
          for d in gpkg csv shp; do echo "== $d"; curl -s -m 60 $M$d/ | grep -o 'href="[^"?][^"]*"' | grep -v http | head -8; done
      - name: escolas gpkg
        run: |
          curl -sL -m 300 -o /tmp/e.gpkg https://github.com/ipea/geobr/releases/download/v1.7.0/schools_2023.gpkg
          ls -la /tmp/e.gpkg
          python3 - <<'PY'
          import sqlite3
          c=sqlite3.connect('/tmp/e.gpkg')
          for (n,) in c.execute("select table_name from gpkg_contents"):
              print("tabela",n, c.execute("select count(*) from %s"%n).fetchone())
              cols=[r[1] for r in c.execute("pragma table_info(%s)"%n)]; print(cols)
              for r in c.execute("select * from %s limit 3"%n): print([ (x if not isinstance(x,bytes) else x[:30].hex()) for x in r])
          print(c.execute("select column_name,geometry_type_name,srs_id from gpkg_geometry_columns").fetchall())
          PY
