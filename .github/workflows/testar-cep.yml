# TEMPORARIO: mede se o CEP recupera a posicao das escolas sem coordenada.
name: Testar CEP das escolas
on:
  workflow_dispatch:
    inputs:
      uf:
        default: SP
permissions: {}
jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python scripts/testar_cep_escolas.py ${{ inputs.uf }} --amostra 150 --faltantes 200
